services:
  bot:
    build: .
    container_name: rugpull-bakery-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json:ro
    init: true
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
